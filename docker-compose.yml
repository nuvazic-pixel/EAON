version: "3.8"

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: eaon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Ollama (optional - uncomment if you want containerized)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: eaon-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

volumes:
  redis_data:
  # ollama_data:

networks:
  default:
    name: eaon-network
