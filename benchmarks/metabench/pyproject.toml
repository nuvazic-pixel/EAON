[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaon-metabench"
version = "0.1.0"
description = "A local-first cognitive benchmark harness for evaluating metacognition and recovery in AI systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "EAON Project"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
eaon-bench = "eaon_metabench.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
