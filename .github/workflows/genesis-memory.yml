name: Genesis memory

on:
  push:
    paths:
      - "modules/genesis/**"
      - ".github/workflows/genesis-memory.yml"
  pull_request:
    paths:
      - "modules/genesis/**"
      - ".github/workflows/genesis-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        working-directory: modules/genesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test Genesis memory and SELF loop
        run: python -m unittest discover -s tests -v
