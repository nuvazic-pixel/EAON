name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-verify.txt
      # Package installation is the only networked phase; the verifier installs nothing.
      - name: Install declared verification dependencies
        run: python -m pip install -r requirements-verify.txt
      - name: Run isolated offline suites
        run: python scripts/verify_workspace.py --report-dir verification-results
      - name: Recover continuity in independent processes
        run: python scripts/demo_continuity.py
      - name: Preserve per-suite results (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-py312
          path: verification-results/
          if-no-files-found: warn
          retention-days: 14
  synapse-contract:
    name: Synapse evidence interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Synapse evidence API
        uses: actions/checkout@v4
        with:
          repository: nuvazic-pixel/rage-against-the-machine
          ref: 86c228de234a8da38b69824e17e8862d3912f4b9
          path: .contract-synapse
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .contract-synapse/requirements-contract-tests.txt
      - run: python -m pip install -r .contract-synapse/requirements-contract-tests.txt
      - name: Exercise real HTTP schema with signed synthetic users
        run: python scripts/probe_synapse_contract.py --synapse-root .contract-synapse
  project-ui:
    name: Project attachment in Streamlit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ui-contracts.txt
      - run: python -m pip install -r requirements-ui-contracts.txt
      - name: Exercise actual UI with synthetic inference and temporary state
        env:
          INTEL_ENABLED: "false"
          SLACK_ENABLED: "false"
          JIRA_ENABLED: "false"
          REDIS_ENABLED: "false"
        run: python scripts/probe_project_ui.py
